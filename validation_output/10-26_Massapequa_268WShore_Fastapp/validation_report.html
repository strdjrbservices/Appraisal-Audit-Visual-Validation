<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appraisal Image Validation Report - 2725 Princess Street</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-card: #172033;
            --border: #1f2d48;
            --primary: #38bdf8;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --pass: #10b981;
            --review: #f59e0b;
            --fail: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 32px 24px;
            line-height: 1.5;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(17, 24, 39, 0.9));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .header-title h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header-subtitle { color: var(--primary); font-weight: 600; font-size: 15px; }
        .header-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .meta-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
        }
        .meta-pill strong { color: #cbd5e1; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
        }
        .stat-card.stat-total::after { background: var(--primary); }
        .stat-card.stat-pass::after { background: var(--pass); }
        .stat-card.stat-review::after { background: var(--review); }
        .stat-card.stat-fail::after { background: var(--fail); }
        
        .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 32px; font-weight: 800; margin: 6px 0 2px; }
        .stat-sub { font-size: 13px; color: var(--text-muted); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filters {
            display: flex;
            gap: 8px;
            background: var(--surface);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #0f172a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .card-img-wrap {
            position: relative;
            width: 100%;
            height: 230px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: zoom-in;
            transition: transform 0.3s;
        }
        .card-img-wrap img:hover { transform: scale(1.03); }
        
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
        }
        .card-body {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .page-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .conf-text { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .conf-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        .conf-bar-fill { height: 100%; border-radius: 4px; }
        
        .section-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 8px;
            margin-bottom: 4px;
        }
        .observed-text {
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 8px;
        }
        .ocr-tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }
        .ocr-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .ocr-empty { color: #64748b; font-style: italic; }
        .reason-box {
            margin-top: auto;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>Appraisal Visual Validation Report</h1>
                <div class="header-subtitle">2725 Princess Street</div>
            </div>
            <div class="header-meta">
                <div class="meta-pill"><strong>File No:</strong> File No.
There</div>
                <div class="meta-pill"><strong>Borrower:</strong> Invoice # :</div>
                <div class="meta-pill"><strong>Pages:</strong> 37</div>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card stat-total">
                <div class="stat-label">Total Assets Analyzed</div>
                <div class="stat-value" style="color: var(--primary);">0</div>
                <div class="stat-sub">Across 37 appraisal pages</div>
            </div>
            <div class="stat-card stat-pass">
                <div class="stat-label">Validation Pass Rate</div>
                <div class="stat-value" style="color: var(--pass);">0%</div>
                <div class="stat-sub">0 Verified Matches</div>
            </div>
            <div class="stat-card stat-review">
                <div class="stat-label">Review Flags</div>
                <div class="stat-value" style="color: var(--review);">0</div>
                <div class="stat-sub">Requires manual check</div>
            </div>
            <div class="stat-card stat-fail">
                <div class="stat-label">Average Confidence</div>
                <div class="stat-value" style="color: #a855f7;">0%</div>
                <div class="stat-sub">Vision model consensus</div>
            </div>
        </section>

        <div class="toolbar">
            <div class="filters">
                <button class="filter-btn active" onclick="filterStatus('all')">All Assets (0)</button>
                <button class="filter-btn" onclick="filterStatus('PASS')">Passed (0)</button>
                <button class="filter-btn" onclick="filterStatus('REVIEW')">Review (0)</button>
                <button class="filter-btn" onclick="filterStatus('FAIL')">Failed (0)</button>
            </div>
        </div>

        <main class="grid">
            
        </main>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <img id="modalImg" class="modal-content" src="" />
    </div>

    <script>
        function filterStatus(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.card').forEach(card => {
                if (status === 'all' || card.getAttribute('data-status') === status) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openModal(src, title) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
    </script>
</body>
</html>
